<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" width="100%" height="100%">
  <defs>
    <!-- Sophisticated Golden Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#F3E5AB" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    
    <!-- Soft Glow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg { fill: transparent; }
    .monogram-circle { stroke: url(#goldGrad); stroke-width: 2; fill: none; }
    .monogram-text { font-family: 'Playfair Display', 'Didot', 'Georgia', serif; font-size: 52px; fill: url(#goldGrad); font-weight: 600; text-anchor: middle; }
    .main-text { font-family: 'Montserrat', 'Helvetica Neue', 'Arial', sans-serif; font-size: 42px; fill: #222222; font-weight: 700; letter-spacing: 4px; }
    .sub-text { font-family: 'Montserrat', 'Helvetica Neue', 'Arial', sans-serif; font-size: 11px; fill: #777777; font-weight: 500; letter-spacing: 8px; text-transform: uppercase; }
    .accent-line { stroke: url(#goldGrad); stroke-width: 1.5; stroke-dasharray: 2, 2; }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Logo Mark (Monogram) -->
  <g transform="translate(10, 0)">
    <circle cx="75" cy="75" r="42" class="monogram-circle" />
    <circle cx="75" cy="75" r="37" stroke="url(#goldGrad)" stroke-width="0.5" fill="none" opacity="0.6" />
    <text x="74" y="93" class="monogram-text">A</text>
  </g>

  <!-- Typography Brand Name -->
  <g transform="translate(150, 0)">
    <!-- Main Brand Name -->
    <text x="0" y="78" class="main-text">Ahn’s</text>
    
    <!-- Subtitle / Tagline -->
    <text x="3" y="108" class="sub-text">EST. 2026</text>
    
    <!-- Decorative Elegant Dot -->
    <circle cx="150" cy="66" r="4" fill="url(#goldGrad)" filter="url(#subtleGlow)" />
  </g>
</svg>
